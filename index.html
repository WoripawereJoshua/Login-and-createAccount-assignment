<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | MUST Admissions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="auth-card" aria-labelledby="login-title">
        <img class="logo" src="must-logo.png" alt="Mbarara University of Science and Technology logo" />
        <p class="portal-name">MUST Admissions Portal</p>
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">Sign in to continue your application.</p>
        <form action="#">
          <label>Email address<input type="email" placeholder="you@example.com" autocomplete="email" required /></label>
          <label>Password<input type="password" placeholder="Enter your password" autocomplete="current-password" required /></label>
          <div class="form-row"><label class="check"><input type="checkbox" /> Remember me</label><a href="#reset">Forgot password?</a></div>
          <button type="submit">Sign in</button>
        </form>
        <p class="alternate">New applicant? <a href="create-account.html">Create an account</a></p>
      </section>
      <footer>© 2026 Mbarara University of Science and Technology</footer>
    </main>
  </body>
</html>
