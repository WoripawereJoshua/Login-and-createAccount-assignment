<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | MUST Admissions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="auth-card" aria-labelledby="create-title">
        <img class="logo" src="assets/must-logo.png" alt="Mbarara University of Science and Technology logo" />
        <p class="portal-name">MUST Admissions Portal</p>
        <h1 id="create-title">Create an account</h1>
        <p class="intro">Start your application. We will verify your email and mobile number.</p>
        <form action="#">
          <div class="name-fields">
            <label>First name<input type="text" autocomplete="given-name" required /></label>
            <label>Last name<input type="text" autocomplete="family-name" required /></label>
          </div>
          <label>Email address<input type="email" placeholder="you@example.com" autocomplete="email" required /></label>
          <label>Mobile number<input type="tel" placeholder="+256 700 000 000" autocomplete="tel" required /></label>
          <label>Password<input type="password" placeholder="At least 8 characters" autocomplete="new-password" required /></label>
          <label class="check"><input type="checkbox" required /> I agree to the <a href="#terms">terms</a> and <a href="#privacy">privacy notice</a>.</label>
          <button type="submit">Create account</button>
        </form>
        <p class="alternate">Already have an account? <a href="index.html">Sign in</a></p>
      </section>
      <footer>© 2026 Mbarara University of Science and Technology</footer>
    </main>
  </body>
</html>
